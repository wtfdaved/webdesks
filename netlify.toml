# WebDesks is a static site; the only build step writes the public Supabase
# settings from environment variables into supabase-config.js.
[build]
  publish = "."
  command = "node scripts/write-supabase-config.mjs"

# Serverless helpers. ics.mjs fetches a calendar's .ics feed for the
# dashboard agenda (calendar servers don't allow browser CORS).
[functions]
  directory = "netlify/functions"

# The sign-in page must never be framed by another site (clickjacking).
[[headers]]
  for = "/login*"
  [headers.values]
    X-Frame-Options = "DENY"
    Content-Security-Policy = "frame-ancestors 'none'"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Cache-Control = "no-cache"

# Always fetch the current config so key changes apply without a cache bust.
[[headers]]
  for = "/supabase-config.js"
  [headers.values]
    Cache-Control = "no-cache"

# The service worker must always be re-checked so new versions roll out.
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"
    Service-Worker-Allowed = "/"

# Calendar feeds are personal: never let a CDN or browser share them.
[[headers]]
  for = "/.netlify/functions/*"
  [headers.values]
    Referrer-Policy = "no-referrer"
